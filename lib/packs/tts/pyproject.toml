[project]
name = "joedit-tts"
version = "0.1.0"
description = "Text to speech with natural voices (Kokoro-82M, Apache-2.0, fast on CPU)."
requires-python = ">=3.10,<3.13"
dependencies = [
  "kokoro>=0.9.4",
  "soundfile>=0.12",
  # The English word splitter Kokoro uses (normally downloaded at first use, which needs pip).
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
