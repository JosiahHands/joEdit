[project]
name = "joedit-videogen"
version = "0.2.0"
description = "Video clips from a description or a starting picture (FastWan 2.2 TI2V-5B, 3 steps, Apache-2.0). Runs on NVIDIA GPUs from 8 GB and Apple Silicon; ~24 GB of models."
requires-python = ">=3.11,<3.13"
dependencies = [
  "diffusers>=0.36",
  "transformers>=4.51",
  "torch>=2.5",
  "accelerate",
  "ftfy",
  "sentencepiece",
  "pillow",
  "numpy",
  # 4-bit models for GPUs under 10 GB (NVIDIA only).
  "bitsandbytes>=0.45; sys_platform != 'darwin'",
]

[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]

# On Windows, PyPI's torch runs on the CPU only: the NVIDIA (CUDA) build comes from PyTorch's own index.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]
