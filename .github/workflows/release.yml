# Auto release: a commit on main whose title starts with a version, like "v2.1.1: color fixes",
# is tagged v2.1.1 and published as "joEdit 2.1.1". The release notes are the commit message body.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release the version in the commit title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(git log -1 --format=%s)
          tag=$(echo "$title" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$tag" ]; then
            echo "No vX.Y.Z at the start of \"$title\": nothing to release."
            exit 0
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          # The commit message body, without the co-author line, becomes the release notes.
          git log -1 --format=%b | grep -v '^Co-Authored-By:' > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "joEdit ${tag#v}" --notes-file notes.md --latest
